name: Python Quality Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify project compiles
        run: |
          python -m compileall .

      - name: Run unit tests
        run: |
          pytest

      - name: Run Black
        run: |
          black --check .

      - name: Run isort
        run: |
          isort --check-only .

      - name: Run Flake8
        run: |
          flake8 .

      - name: Run MyPy
        run: |
          mypy src